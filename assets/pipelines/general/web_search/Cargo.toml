# Independent pipeline unit: own build, own tests, connects to the host
# and registers itself (see src/pipeline/remote.rs on the host side).
[package]
name = "ozone-pipeline-web_search"
version = "0.4.0"
edition = "2021"

[[bin]]
name = "web_search"
path = "main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }

# Own workspace root: independent unit — builds anywhere, connects over the wire.
[workspace]
