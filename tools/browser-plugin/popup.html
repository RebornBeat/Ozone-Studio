<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: system-ui, sans-serif; width: 280px; padding: 12px; margin: 0; }
    h1 { font-size: 15px; display: flex; align-items: center; gap: 6px; margin: 0 0 10px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
    .ok { background: #2ecc71; }
    .bad { background: #e74c3c; }
    label { display: block; font-size: 12px; margin-top: 10px; opacity: 0.8; }
    input { width: 100%; box-sizing: border-box; font-size: 12px; padding: 4px; }
    button { margin-top: 10px; padding: 6px 10px; width: 100%; cursor: pointer; }
    #status { font-size: 12px; margin-top: 8px; min-height: 16px; }
  </style>
</head>
<body>
  <h1><span class="dot ok" id="dot"></span> Ozone-Studio Monitor</h1>
  <label>Host URL</label>
  <input id="ozoneUrl" placeholder="http://127.0.0.1:8080" />
  <label>Agent name</label>
  <input id="agentName" placeholder="browser-plugin" />
  <button id="save">Save + re-register</button>
  <button id="pushTest">Push test activity</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
